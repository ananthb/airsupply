name: Release

# A tag v<version> publishes ghcr.io/ananthb/airsupply:v<version>, one
# manifest covering amd64 and aarch64. That tag is what ananthb/hass-addons
# pins in airsupply/build.yaml; its CI refuses a pin that does not resolve,
# so tag here first, then bump there.
#
# Each architecture builds natively -- GitHub's arm64 runners are free on a
# public repository, and building libairmini and pip under QEMU is not worth
# the minutes -- and pushes by digest. A final job stitches the digests into
# the tagged manifest, so the tag either names both architectures or nothing.
on:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/ananthb/airsupply

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.21
          - runner: ubuntu-24.04-arm
            arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.21
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: airsupply
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        run: |
          mkdir -p digests
          touch "digests/${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the tagged manifest
        working-directory: digests
        run: |
          set -euo pipefail
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@${digest}")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${{ github.ref_name }}" \
            -t "${IMAGE}:latest" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${{ github.ref_name }}"
