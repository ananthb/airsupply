name: CI

# Builds the image without pushing it. The Dockerfile carries its own checks:
# libairmini's tests run under ctest, the .so has to load against the image's
# libcrypto, and the Python has to compile and import.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - run: pip install -r requirements.txt
        working-directory: airsupply

      # The image build runs these too, but only against what ships in it.
      # Here the Elm source is present, so the check that the page's decoders
      # still match the state the add-on sends actually runs rather than
      # skipping itself.
      - run: python3 -m unittest discover -s tests -v
        working-directory: airsupply
        env:
          PYTHONPATH: src

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: airsupply
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21
          cache-from: type=gha
          cache-to: type=gha,mode=max
