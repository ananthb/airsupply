name: CI

# Builds the image without pushing it. The Dockerfile carries its own checks:
# libairmini's tests run under ctest, the .so has to load against the image's
# libcrypto, and the Python has to compile and import.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: airsupply
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21
          cache-from: type=gha
          cache-to: type=gha,mode=max
