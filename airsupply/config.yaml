name: airsupply
version: "0.0.1"
slug: airsupply
description: "Read a ResMed AirMini CPAP over Bluetooth Classic. Surveys what BlueZ can see, opens the serial channel, and reproduces libairmini's verified reads. No writes."
url: "https://github.com/ananthb/airsupply"
arch:
  - aarch64
  - amd64
  - armv7

init: false
startup: services

# Manual, not `auto`. This talks to a medical device and does not yet know
# whether it can; nothing here should start itself on boot until it does.
boot: manual

# Permissions, matching what scyto/ha-bluetooth-audio-manager established is
# both necessary and sufficient for Bluetooth Classic from an add-on.
# `udev`, `devices` and `host_network` are deliberately absent -- BlueZ is
# reached over D-Bus, never through /dev/hci*.
host_dbus: true
privileged:
  - NET_ADMIN
  - NET_RAW
apparmor: true

map:
  - type: data
    read_only: false

options:
  log_level: info
  address: ""
  connect: false
  read: false
  pin: ""

schema:
  log_level: "list(debug|info|warning|error)"
  # BD_ADDR of the AirMini, e.g. "00:11:22:33:44:55". Empty means report only.
  address: "str?"
  # Attempt to open the serial channel. Leave false until the survey looks right.
  connect: "bool"
  # Handshake and read. Implies connect.
  read: "bool"
  # The number the machine shows in pairing mode. Needed exactly once: the
  # pairing key it buys is kept in /data and used from then on. Clear it
  # afterwards -- `password` keeps it out of the log, not out of a backup.
  pin: "password?"
